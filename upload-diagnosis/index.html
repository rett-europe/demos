<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>rettX demo</title><link rel="stylesheet" href="../assets/player.css"></head><body>
<header><h1><a id="home" href="../"></a> · <span id="title"></span></h1>
<div class="hr"><div class="seg" id="views" role="group" aria-label="View"><button data-m="desktop">Desktop</button><button data-m="mobile">Mobile</button><button data-m="both">Side by side</button></div><select id="lang" aria-label="Language"></select></div></header>
<nav class="stepper" id="stepper" aria-label="Steps"></nav>
<main><section>
<div class="stage mode-both" id="stage">
<div class="dev desk" id="dd"><video id="v" playsinline preload="auto" muted></video></div>
<div class="dev phone" id="dm"><video id="vm" playsinline preload="auto" muted></video></div></div>
<div class="ctl"><button id="pp" aria-label="Play">▶</button><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek"><span id="time">0:00 / 0:00</span></div>
<div id="err"></div><div class="nav" id="nav"></div></section>
<aside><h2 id="stepsH">Steps</h2><ul id="steps"></ul></aside></main>
<script src="../assets/journey.js"></script><script src="demo.js"></script><script src="../assets/player.js"></script></body></html>
