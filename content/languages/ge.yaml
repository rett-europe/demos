      add: დაამატეთ დიაგნოზის ფაილი (PDF ან სურათი)
      source: დაასკანირეთ ტელეფონის კამერით ან აირჩიეთ ფაილი მოწყობილობის საქაღალდეებიდან
      processing: ფაილი უსაფრთხოდ იტვირთება და მუშავდება
      review: გაგზავნილია! rettX-ის გუნდი ახლა გადახედავს
    completed:
      patient: rettX-ის გუნდმა გადახედა დიაგნოზს
      banner: დადასტურდა! თქვენი რეგისტრაცია დასრულებულია
      mutation: დადასტურებული გენის მუტაცია ახლა პაციენტის ჩანაწერის ნაწილია
  validation:
    - title: rettX-ის გუნდი ამოწმებს
      text: თითოეულ ატვირთულ დიაგნოზს rettX-ის გუნდის წევრი ამოწმებს პაციენტის დადასტურებამდე.
    - title: რას ვამოწმებთ
      text: ანგარიშში უნდა ჩანდეს პაციენტის სახელი, დაბადების თარიღი და რეტის სინდრომის დიაგნოზი, გენის მუტაციის ტესტის შედეგის ჩათვლით.
    - title: მოწმდება
      text: შემოწმებისას პაციენტი ჩანს სტატუსით „მოწმდება“. შეგიძლიათ აპლიკაციის გამოყენება გააგრძელოთ და ცვლილებებზე შეგატყობინებთ.
    - title: გჭირდებათ დამატებითი ინფორმაცია?
      text: თუ რამე აკლია ან გაურკვეველია, სტატუსი იცვლება „საჭიროა დამატებითი ინფორმაცია“ და შეგიძლიათ განახლებული ანგარიშის ატვირთვა.
    - title: დადასტურებულია
      text: დადასტურების შემდეგ პაციენტი იღებს RETTXID-ს, ხოლო დადასტურებული მუტაცია ემატება ჩანაწერს.
    - title: კარგია იცოდეთ
      text: rettX არ არის სამედიცინო მოწყობილობა. დადასტურება მხოლოდ რეესტრის მონაცემებს ამოწმებს; ის არ არის სამედიცინო რჩევა, დიაგნოზი ან მკურნალობის რეკომენდაცია.
story:
  ui:
    step: ნაბიჯი
    next: შემდეგ
    tapContinue: შეეხეთ გასაგრძელებლად
    tapStart: შეეხეთ დასაწყებად
    replay: ხელახლა ნახვა
    title: rettX · როგორ დარეგისტრირდეთ
  cards:
    go-to-app:
      title: გადადით app.rettx.eu-ზე
      text: გახსენით app.rettx.eu თქვენს ტელეფონზე ან კომპიუტერზე. ეს არის რეტის სინდრომის ევროპული რეესტრის სახლი. რეგისტრაციისთვის შეეხეთ ღილაკს „შეუერთდი rettX-ს“.
    create-account:
      title: შექმენით ანგარიში
      text: ეკრანზე „შექმენით თქვენი ანგარიში“ შეიყვანეთ თქვენი საკუთარი ელფოსტის მისამართი და შეეხეთ ღილაკს „გაგრძელება“. გთხოვთ, გამოიყენოთ საკუთარი ელფოსტა და არა თქვენი ახლობლისთვის შექმნილი მისამართი.
    no-password:
      title: პაროლი საჭირო არ არის
      text: rettX არასოდეს გთხოვთ პაროლს. ყოველ ჯერზე, როცა შედიხართ, თქვენს ელფოსტაზე იგზავნება ახალი ერთჯერადი კოდი. არაფრის დამახსოვრება, ხელახლა გამოყენება ან მოპარვა არ შეიძლება. შესვლა მხოლოდ იმას შეუძლია, ვისაც თქვენს ელფოსტაზე აქვს წვდომა, რაც მას კიდევ უფრო უსაფრთხოს ხდის.
    enter-code:
      title: შეიყვანეთ კოდი ელფოსტიდან
      text: გახსენით თქვენი ელფოსტა, იპოვეთ rettX-ის წერილი და შეიყვანეთ კოდი ეკრანზე „დაადასტურეთ თქვენი ვინაობა“.
    set-up-account:
      title: დააყენეთ თქვენი ანგარიში
      text: თქვენი ანგარიში შექმნილია. ახლა rettX გკითხავთ სასურველ ენას, თქვენს სახელს და საცხოვრებელ ადგილს.
    privacy:
      title: მიიღეთ კონფიდენციალურობის პოლიტიკა
      text: გაეცანით, როგორ არის დაცული თქვენი მონაცემები, შემდეგ კი გასაგრძელებლად მიიღეთ კონფიდენციალურობის პოლიტიკა.
    welcome:
      title: კეთილი იყოს თქვენი მობრძანება rettX-ში!
      text: "თქვენ შეხვედით. ახლა შექმენით თქვენი ახლობლის პროფილი ძირითადი მონაცემებით: სახელი, გვარი, დაბადების თარიღი და თქვენი ნათესაური კავშირი."
    consent:
      title: გამოხატეთ თანხმობა
      text: გაეცანით თქვენი ახლობლის თანხმობის ფორმას და მიიღეთ იგი. ამის შემდეგ პროფილი შეიქმნება.
    upload-report:
      title: ატვირთეთ გენეტიკური დასკვნა
      text: "rettX-ს სჭირდება გენეტიკური ტესტის დასკვნა, რომელიც ადასტურებს რეტის სინდრომის დიაგნოზს. მასში უნდა ჩანდეს თქვენი ახლობლის სახელი, დაბადების თარიღი და გენის მუტაცია. მისი დამატება ორი გზით შეიძლება: აირჩიეთ ფაილი, რომელიც უკვე გაქვთ ტელეფონში, ან დაასკანერეთ ქაღალდის დასკვნა კამერით."
    option-file:
      title: "ვარიანტი 1: დაამატეთ ფაილი"
      text: თუ დასკვნა ტელეფონში PDF-ის ან ფოტოს სახით გაქვთ, მაგალითად ელფოსტიდან, შეეხეთ ღილაკს „დიაგნოზის ფაილის ატვირთვა“ და აირჩიეთ იგი ტელეფონიდან.
    option-scan:
      title: "ვარიანტი 2: დაასკანერეთ ქაღალდის დასკვნა"
      text: თუ დასკვნა მხოლოდ ქაღალდზე გაქვთ, შეეხეთ ღილაკს „დოკუმენტის სკანირება“. დადეთ დასკვნა ბრტყელ ზედაპირზე და გადაუღეთ ფოტო თითოეულ გვერდს. როცა ყველა გვერდი გადაღებულია, შეეხეთ ღილაკს „დასრულება“ და rettX მათ ერთ PDF-ად გააერთიანებს.
    sent:
      title: უსაფრთხოდ გაიგზავნა
      text: რომელი ვარიანტიც არ უნდა აირჩიოთ, დასკვნა უსაფრთხოდ იტვირთება და მუშავდება. ახლა მას rettX-ის გუნდი განიხილავს.
    validation:
      title: rettX-ის გუნდი ადასტურებს დიაგნოზს
      text: rettX-ის გუნდის წევრი კითხულობს დასკვნას და ამოწმებს, რომ ის თქვენს ახლობელს ეკუთვნის და ადასტურებს რეტის სინდრომს გენის მუტაციით. სანამ დასკვნა განხილვის პროცესშია, პროფილის შეცვლა შეუძლებელია. სხვა არაფრის გაკეთება არ გჭირდებათ.
    confirmed:
      title: დიაგნოზი დადასტურებულია
      text: დადასტურების შემდეგ პროფილი მოინიშნება როგორც დადასტურებული და თქვენი რეგისტრაცია დასრულებულია.
    mutation:
      title: გენის მუტაცია პროფილშია
      text: "დასკვნიდან დადასტურებული გენის მუტაცია ახლა თქვენი ახლობლის პროფილის ნაწილია. აქ ჩანს დეტალები: კოდირების ცვლილება, ცილის ცვლილება და გენომური პოზიცია."
    thank-you:
      title: კეთილი იყოს თქვენი მობრძანება rettX-ის საზოგადოებაში
      text: "გმადლობთ რეგისტრაციისთვის! თქვენი ახლობელი ახლა რეტის სინდრომის ევროპული რეესტრის ნაწილია. გაითვალისწინეთ: rettX არ არის სამედიცინო მოწყობილობა. დადასტურება მხოლოდ რეესტრის მონაცემებს ადასტურებს; ეს არ არის სამედიცინო რჩევა."
      kick: ყველაფერი მზადაა
