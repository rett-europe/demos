  captions:
    onboarding:
      - Wybierz preferowany język
      - Przejdź do następnego kroku
      - Opowiedz nam trochę o sobie
      - Wybierz swój kraj i region
      - Dalej
      - Przeczytaj politykę prywatności
      - Przewiń do końca i zaakceptuj
      - Wszystko gotowe – witamy w rettX!
    create-patient:
      home: Dodaj pacjenta ze strony głównej
      names: Wpisz imię i nazwisko pacjenta
      details: Wybierz płeć i kraj urodzenia
      birthdate: Wybierz datę urodzenia
      relationship: Wskaż, kim jesteś dla pacjenta
      next: Przejdź do zgody
      consent: Przeczytaj formularz zgody
      accept: Zaakceptuj, aby utworzyć pacjenta
