    onboarding:
      - Wählen Sie Ihre bevorzugte Sprache
      - Weiter zum nächsten Schritt
      - Erzählen Sie uns ein wenig über sich
      - Wählen Sie Ihr Land und Ihre Region
      - Weiter
      - Lesen Sie die Datenschutzerklärung
      - Bis zum Ende scrollen und zustimmen
      - Alles bereit – willkommen bei rettX!
    create-patient:
      home: Fügen Sie auf Ihrer Startseite einen Patienten hinzu
      names: Geben Sie den Namen des Patienten ein
      details: Wählen Sie Geschlecht und Geburtsland
      birthdate: Wählen Sie das Geburtsdatum
