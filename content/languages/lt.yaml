    onboarding:
      - Pasirinkite norimą kalbą
      - Pereikite prie kito žingsnio
      - Papasakokite šiek tiek apie save
      - Pasirinkite savo šalį ir regioną
      - Tęsti
      - Perskaitykite privatumo politiką
      - Slinkite iki galo ir sutikite
