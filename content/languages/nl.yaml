  captions:
    onboarding:
      - Kies je voorkeurstaal
      - Ga naar de volgende stap
      - Vertel ons iets over jezelf
      - Selecteer je land en regio
      - Doorgaan
      - Lees het privacybeleid
      - Scroll naar het einde en ga akkoord
      - Alles klaar – welkom bij rettX!
    create-patient:
      home: Voeg een patiënt toe vanaf je startpagina
      names: Vul de naam van de patiënt in
      details: Selecteer geslacht en geboorteland
      birthdate: Kies de geboortedatum
      relationship: Geef je relatie tot de patiënt aan
      next: Ga verder naar de toestemming
      consent: Lees het toestemmingsformulier
      accept: Ga akkoord om de patiënt aan te maken
      created: Patiënt aangemaakt – nu de diagnose
    upload-diagnosis:
      patient: Je patiënt heeft nu een diagnose nodig
      instructions: Het rapport moet naam, geboortedatum en de diagnose Rett-syndroom met de gen-mutatietest bevatten
      add: Voeg het diagnosebestand toe (pdf of afbeelding)
      source: Scan het met de camera van je telefoon of kies het bestand uit de mappen van je apparaat
      processing: Het bestand wordt veilig geüpload en verwerkt
      review: Verzonden! Het rettX-team bekijkt het nu
    completed:
      patient: Het rettX-team heeft de diagnose beoordeeld
      banner: Gevalideerd! Je registratie is voltooid
      mutation: De bevestigde genmutatie maakt nu deel uit van het dossier van de patiënt
  validation:
    - title: Het rettX-team beoordeelt het
      text: Elke geüploade diagnose wordt gecontroleerd door iemand van het rettX-team voordat de patiënt wordt bevestigd.
    - title: Waar we op letten
      text: Het rapport moet de naam, geboortedatum en de diagnose Rett-syndroom van de patiënt tonen, inclusief de uitslag van de gen-mutatietest.
    - title: In beoordeling
      text: Tijdens de beoordeling staat de patiënt als “In beoordeling”. Je kunt de app blijven gebruiken en krijgt een melding bij elke wijziging.
    - title: Meer informatie nodig?
      text: Als er iets ontbreekt of onduidelijk is, verandert de status in “Meer informatie vereist” en kun je een bijgewerkt rapport uploaden.
    - title: Bevestigd
      text: Na validatie krijgt de patiënt een RETTXID en wordt de bevestigde mutatie aan het dossier toegevoegd.
    - title: Goed om te weten
      text: rettX is geen medisch hulpmiddel. De validatie bevestigt alleen de gegevens in het register; het is geen medisch advies, diagnose of behandeladvies.
story:
  ui:
    step: Stap
    next: Wat volgt
    tapContinue: Tik om verder te gaan
    tapStart: Tik om te beginnen
    replay: Opnieuw bekijken
    title: rettX · Zo registreert u zich
  cards:
    go-to-app:
      title: Ga naar app.rettx.eu
      text: Open app.rettx.eu op uw telefoon of computer. Het is de thuisbasis van het Europese register voor het Rett-syndroom. Tik op “Word lid van rettX” om u te registreren.
    create-account:
      title: Maak uw account aan
      text: Typ op het scherm “Maak uw account aan” uw eigen e-mailadres en tik op “Doorgaan”. Gebruik uw eigen e-mailadres, niet een adres dat voor uw naaste is aangemaakt.
    no-password:
      title: Geen wachtwoord nodig
      text: rettX vraagt nooit om een wachtwoord. Telkens wanneer u inlogt, ontvangt u per e-mail een nieuwe eenmalige code. Er valt niets te onthouden, niets te hergebruiken en niets te stelen. Alleen wie toegang heeft tot uw mailbox kan inloggen, en dat maakt het nog veiliger.
    enter-code:
      title: Voer de code uit uw e-mail in
      text: Open uw mailbox, zoek de e-mail van rettX en typ de code op het scherm “Verifieer uw identiteit”.
    set-up-account:
      title: Stel uw account in
      text: Uw account is aangemaakt. rettX vraagt nu naar uw voorkeurstaal, uw naam en waar u woont.
    privacy:
      title: Accepteer het privacybeleid
      text: Lees hoe uw gegevens worden beschermd en accepteer daarna het privacybeleid om verder te gaan.
    welcome:
      title: Welkom bij rettX!
      text: "U bent binnen. Maak nu het profiel van uw naaste aan met de basisgegevens: voornaam, achternaam, geboortedatum en uw relatie."
    consent:
      title: Geef uw toestemming
      text: Lees het toestemmingsformulier voor uw naaste door en accepteer het. Daarna wordt het profiel aangemaakt.
    upload-report:
      title: Upload het genetische rapport
      text: "rettX heeft het rapport van de genetische test nodig dat de diagnose Rett-syndroom bevestigt. Daarop moeten de naam en geboortedatum van uw naaste en de genmutatie staan. U kunt het op twee manieren toevoegen: kies een bestand dat al op uw telefoon staat, of scan het papieren rapport met uw camera."
    option-file:
      title: "Optie 1: een bestand toevoegen"
      text: Hebt u het rapport als pdf of foto op uw telefoon, bijvoorbeeld uit een e-mail? Tik dan op “Diagnosebestand uploaden” en kies het op uw telefoon.
    option-scan:
      title: "Optie 2: het papieren rapport scannen"
      text: Hebt u het rapport alleen op papier? Tik dan op “Document scannen”. Leg het rapport op een vlakke ondergrond en maak van elke pagina een foto. Als alle pagina’s zijn vastgelegd, tikt u op “Voltooien” en maakt rettX er één pdf van.
    sent:
      title: Veilig verzonden
      text: Welke optie u ook kiest, het rapport wordt veilig geüpload en verwerkt. Het rettX-team beoordeelt het nu.
    validation:
      title: Het rettX-team valideert de diagnose
      text: Iemand van het rettX-team leest het rapport en controleert of het bij uw naaste hoort en het Rett-syndroom met de genmutatie bevestigt. Zolang het rapport “In beoordeling” is, kan het profiel niet worden gewijzigd. U hoeft verder niets te doen.
    confirmed:
      title: Diagnose bevestigd
      text: Na validatie wordt het profiel als bevestigd gemarkeerd en is uw registratie voltooid.
    mutation:
      title: De genmutatie staat op het profiel
      text: "De bevestigde genmutatie uit het rapport maakt nu deel uit van het profiel van uw naaste. U ziet de details: de coderende wijziging, de eiwitwijziging en de genomische positie."
    thank-you:
      title: Welkom in de rettX-gemeenschap
      text: "Bedankt voor uw registratie! Uw naaste maakt nu deel uit van het Europese register voor het Rett-syndroom. Let op: rettX is geen medisch hulpmiddel. De validatie bevestigt alleen de gegevens in het register; het is geen medisch advies."
      kick: Klaar
