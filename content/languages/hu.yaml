      mutation: A megerősített génmutáció mostantól a beteg adatlapjának része
  validation:
    - title: A rettX csapata átnézi
      text: Minden feltöltött diagnózist a rettX csapatának egy tagja ellenőriz, mielőtt a beteget megerősítenék.
    - title: Mit ellenőrzünk
      text: A leleten szerepelnie kell a beteg nevének, születési dátumának és a Rett-szindróma diagnózisának, beleértve a génmutáció-teszt eredményét.
    - title: Ellenőrzés alatt
      text: Az ellenőrzés idején a beteg „Ellenőrzés alatt” állapotban látszik. Tovább használhatja az alkalmazást, és értesítést kap minden változásról.
    - title: További információ kell?
      text: Ha valami hiányzik vagy nem egyértelmű, az állapot „További információ szükséges” értékre változik, és feltölthet egy frissített leletet.
    - title: Megerősítve
      text: Az ellenőrzés után a beteg RETTXID azonosítót kap, a megerősített mutáció pedig bekerül az adatlapjára.
    - title: Jó tudni
      text: A rettX nem orvostechnikai eszköz. Az ellenőrzés csak a nyilvántartás adatait erősíti meg; nem orvosi tanács, diagnózis vagy kezelési javaslat.
