    upload-diagnosis:
      patient: A betegnek most diagnózisra van szüksége
      instructions: A leletnek tartalmaznia kell a nevet, a születési dátumot és a Rett-szindróma diagnózisát a génmutáció-teszttel
      add: Adja hozzá a diagnózis fájlját (PDF vagy kép)
