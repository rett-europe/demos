  captions:
    onboarding:
      - Виберіть бажану мову
      - Перейдіть до наступного кроку
      - Розкажіть трохи про себе
      - Виберіть країну та регіон
      - Продовжити
      - Прочитайте політику конфіденційності
      - Прокрутіть до кінця й прийміть
      - Усе готово – ласкаво просимо до rettX!
    create-patient:
      home: Додайте пацієнта зі своєї головної сторінки
      names: Введіть ім’я пацієнта
      details: Виберіть стать і країну народження
      birthdate: Виберіть дату народження
      relationship: Вкажіть, ким ви доводитеся пацієнту
      next: Перейдіть до згоди
      consent: Прочитайте форму згоди
      accept: Прийміть, щоб створити пацієнта
      created: Пацієнта створено – далі діагноз
    upload-diagnosis:
      patient: Тепер вашому пацієнту потрібен діагноз
      instructions: У звіті мають бути ім’я, дата народження та діагноз синдрому Ретта з тестом на генну мутацію
      add: Додайте файл діагнозу (PDF або зображення)
      source: Відскануйте його камерою телефону або виберіть файл у теках свого пристрою
      processing: Файл безпечно завантажується та обробляється
      review: Надіслано! Команда rettX тепер його перегляне
    completed:
      patient: Команда rettX переглянула діагноз
      banner: Підтверджено! Вашу реєстрацію завершено
      mutation: Підтверджена генна мутація тепер є частиною картки пацієнта
  validation:
    - title: Команда rettX перевіряє його
      text: Кожен завантажений діагноз перевіряє людина з команди rettX, перш ніж пацієнта буде підтверджено.
    - title: Що ми перевіряємо
      text: У звіті мають бути ім’я пацієнта, дата народження та діагноз синдрому Ретта, зокрема результат тесту на генну мутацію.
    - title: На перевірці
      text: Поки триває перевірка, пацієнт відображається зі статусом «На перевірці». Ви можете й далі користуватися застосунком, а про будь-які зміни вас сповістять.
    - title: Потрібна додаткова інформація?
      text: Якщо чогось бракує або щось незрозуміло, статус змінюється на «Потрібна додаткова інформація», і ви можете завантажити оновлений звіт.
    - title: Підтверджено
      text: Після перевірки пацієнт отримує RETTXID, а підтверджена мутація додається до його картки.
    - title: Корисно знати
      text: rettX не є медичним виробом. Перевірка підтверджує лише дані реєстру; це не медична порада, не діагноз і не рекомендація щодо лікування.
