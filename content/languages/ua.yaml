name: Українська
chapters:
  title: Реєстрація в rettX
  ui:
    step: Крок
    of: з
    next: Далі
    prev: Назад
    all: Усі демо
    desktop: Комп’ютер
    mobile: Телефон
    both: Поруч
    steps: Кроки
    soon: Незабаром
  steps:
    onboarding: Перші кроки
    create-patient: Створення пацієнта
    upload-diagnosis: Завантаження діагнозу
    validation: Перевірка діагнозу
    completed: Реєстрацію завершено
  captions:
    onboarding:
      - Виберіть бажану мову
      - Перейдіть до наступного кроку
      - Розкажіть трохи про себе
      - Виберіть країну та регіон
      - Продовжити
      - Прочитайте політику конфіденційності
      - Прокрутіть до кінця й прийміть
      - Усе готово – ласкаво просимо до rettX!
    create-patient:
      home: Додайте пацієнта зі своєї головної сторінки
      names: Введіть ім’я пацієнта
      details: Виберіть стать і країну народження
      birthdate: Виберіть дату народження
      relationship: Вкажіть, ким ви доводитеся пацієнту
      next: Перейдіть до згоди
      consent: Прочитайте форму згоди
      accept: Прийміть, щоб створити пацієнта
      created: Пацієнта створено – далі діагноз
    upload-diagnosis:
      patient: Тепер вашому пацієнту потрібен діагноз
      instructions: У звіті мають бути ім’я, дата народження та діагноз синдрому Ретта з тестом на генну мутацію
      add: Додайте файл діагнозу (PDF або зображення)
      source: Відскануйте його камерою телефону або виберіть файл у теках свого пристрою
      processing: Файл безпечно завантажується та обробляється
      review: Надіслано! Команда rettX тепер його перегляне
    completed:
      patient: Команда rettX переглянула діагноз
      banner: Підтверджено! Вашу реєстрацію завершено
      mutation: Підтверджена генна мутація тепер є частиною картки пацієнта
  validation:
    - title: Команда rettX перевіряє його
      text: Кожен завантажений діагноз перевіряє людина з команди rettX, перш ніж пацієнта буде підтверджено.
    - title: Що ми перевіряємо
      text: У звіті мають бути ім’я пацієнта, дата народження та діагноз синдрому Ретта, зокрема результат тесту на генну мутацію.
    - title: На перевірці
      text: Поки триває перевірка, пацієнт відображається зі статусом «На перевірці». Ви можете й далі користуватися застосунком, а про будь-які зміни вас сповістять.
    - title: Потрібна додаткова інформація?
      text: Якщо чогось бракує або щось незрозуміло, статус змінюється на «Потрібна додаткова інформація», і ви можете завантажити оновлений звіт.
    - title: Підтверджено
      text: Після перевірки пацієнт отримує RETTXID, а підтверджена мутація додається до його картки.
    - title: Корисно знати
      text: rettX не є медичним виробом. Перевірка підтверджує лише дані реєстру; це не медична порада, не діагноз і не рекомендація щодо лікування.
story:
  ui:
    step: Крок
    next: Що далі
    tapContinue: Торкніться, щоб продовжити
    tapStart: Торкніться, щоб почати
    replay: Переглянути ще раз
    title: rettX · Як зареєструватися
  cards:
    go-to-app:
      title: Перейдіть на app.rettx.eu
      text: Відкрийте app.rettx.eu на телефоні або комп’ютері. Тут розміщено Європейський реєстр синдрому Ретта. Щоб зареєструватися, торкніться «Приєднатися до rettX».
    create-account:
      title: Створіть обліковий запис
      text: На екрані «Створіть обліковий запис» введіть власну адресу електронної пошти й торкніться «Продовжити». Будь ласка, використовуйте власну пошту, а не адресу, створену для вашої близької людини.
    no-password:
      title: Пароль не потрібен
      text: rettX ніколи не просить пароль. Щоразу, коли ви входите, на вашу пошту надходить новий одноразовий код. Нічого не треба запам’ятовувати, нічого не можна використати повторно чи викрасти. Увійти може лише той, хто має доступ до вашої поштової скриньки, тож це ще безпечніше.
    enter-code:
      title: Введіть код із листа
      text: Відкрийте поштову скриньку, знайдіть лист від rettX і введіть код на екрані «Підтвердьте свою особу».
    set-up-account:
      title: Налаштуйте обліковий запис
      text: Ваш обліковий запис створено. Тепер rettX запитає бажану мову, ваше ім’я та місце проживання.
    privacy:
      title: Прийміть політику конфіденційності
      text: Прочитайте, як захищено ваші дані, а потім прийміть політику конфіденційності, щоб продовжити.
    welcome:
      title: Ласкаво просимо до rettX!
      text: "Ви в системі. Далі створіть профіль вашої близької людини з основними даними: ім’я, прізвище, дата народження та ваш зв’язок із нею."
    consent:
      title: Надайте згоду
      text: Перегляньте форму згоди щодо вашої близької людини та прийміть її. Після цього профіль буде створено.
    upload-report:
      title: Завантажте генетичний звіт
      text: "rettX потрібен звіт генетичного тесту, який підтверджує діагноз синдрому Ретта. У ньому мають бути ім’я вашої близької людини, дата народження та генна мутація. Додати його можна двома способами: вибрати файл, який уже є на телефоні, або відсканувати паперовий звіт камерою."
    option-file:
      title: "Варіант 1: додайте файл"
      text: Якщо звіт є на телефоні у форматі PDF або як фото, наприклад з електронного листа, торкніться «Завантажити файл з діагнозом» і виберіть його на телефоні.
    option-scan:
      title: "Варіант 2: відскануйте паперовий звіт"
      text: Якщо звіт є лише на папері, торкніться «Сканувати документ». Покладіть звіт на рівну поверхню та сфотографуйте кожну сторінку. Коли всі сторінки знято, торкніться «Завершити», і rettX об’єднає їх в один PDF.
    sent:
      title: Надіслано безпечно
      text: Який би варіант ви не обрали, звіт безпечно завантажується й обробляється. Тепер його перевірить команда rettX.
    validation:
      title: Команда rettX перевіряє діагноз
      text: Людина з команди rettX читає звіт і перевіряє, що він стосується вашої близької людини та підтверджує синдром Ретта з генною мутацією. Поки звіт на перевірці, профіль не можна змінювати. Більше нічого робити не потрібно.
    confirmed:
      title: Діагноз підтверджено
      text: Після перевірки профіль позначається як підтверджений, і вашу реєстрацію завершено.
    mutation:
      title: Генна мутація є в профілі
      text: "Підтверджена генна мутація зі звіту тепер є частиною профілю вашої близької людини. Там показано деталі: зміну в кодувальній послідовності, зміну білка та геномну позицію."
    thank-you:
      title: Ласкаво просимо до спільноти rettX
      text: "Дякуємо за реєстрацію! Ваша близька людина тепер є частиною Європейського реєстру синдрому Ретта. Зверніть увагу: rettX не є медичним виробом. Перевірка підтверджує лише дані реєстру; це не медична порада."
      kick: Готово
