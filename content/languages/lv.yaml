      - Izvēlieties savu valsti un reģionu
      - Turpināt
      - Izlasiet privātuma politiku
      - Ritiniet līdz beigām un piekrītiet
      - Viss gatavs – laipni lūdzam rettX!
    create-patient:
      home: Pievienojiet pacientu savā sākumlapā
      names: Ievadiet pacienta vārdu
      details: Izvēlieties dzimumu un dzimšanas valsti
      birthdate: Izvēlieties dzimšanas datumu
      relationship: Norādiet, kas jūs esat pacientam
      next: Turpiniet pie piekrišanas
      consent: Izlasiet piekrišanas veidlapu
      accept: Piekrītiet, lai izveidotu pacientu
      created: Pacients izveidots – tālāk diagnoze
    upload-diagnosis:
      patient: Jūsu pacientam tagad vajadzīga diagnoze
