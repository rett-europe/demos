      add: Pievienojiet diagnozes failu (PDF vai attēls)
      source: Noskenējiet to ar tālruņa kameru vai izvēlieties failu no ierīces mapēm
      processing: Fails tiek droši augšupielādēts un apstrādāts
      review: Nosūtīts! rettX komanda to tagad izskatīs
    completed:
      patient: rettX komanda ir izskatījusi diagnozi
      banner: Apstiprināts! Jūsu reģistrācija ir pabeigta
      mutation: Apstiprinātā gēna mutācija tagad ir pacienta ieraksta daļa
  validation:
    - title: rettX komanda to izskata
      text: Katru augšupielādēto diagnozi pārbauda rettX komandas pārstāvis, pirms pacients tiek apstiprināts.
    - title: Ko mēs pārbaudām
      text: Atzinumā jābūt pacienta vārdam, dzimšanas datumam un Reta sindroma diagnozei, ieskaitot gēna mutācijas testa rezultātu.
    - title: Tiek izskatīts
      text: Kamēr izskatām, pacients tiek rādīts kā “Tiek izskatīts”. Varat turpināt lietot lietotni, un par jebkurām izmaiņām saņemsiet paziņojumu.
    - title: Vajadzīga papildu informācija?
      text: Ja kaut kas trūkst vai nav skaidrs, statuss mainās uz “Nepieciešama papildu informācija”, un varat augšupielādēt atjauninātu atzinumu.
    - title: Apstiprināts
      text: Pēc apstiprināšanas pacients saņem RETTXID, un apstiprinātā mutācija tiek pievienota ierakstam.
    - title: Labi zināt
      text: rettX nav medicīnas ierīce. Apstiprināšana apliecina tikai reģistra datus; tā nav medicīnisks padoms, diagnoze vai ārstēšanas ieteikums.
